<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="220" height="60" fill="#000000" rx="10"/>
  <g fill="#1DB954">
    <rect x="15" y="20" width="14" height="20">
      <animate attributeName="height" values="20;45;10;35;20" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;7.5;25;12.5;20" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="40" y="10" width="14" height="40">
      <animate attributeName="height" values="40;15;35;10;40" dur="1s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;22.5;12.5;25;10" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="65" y="5" width="14" height="50">
      <animate attributeName="height" values="50;20;45;15;50" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="5;20;7.5;22.5;5" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="90" y="15" width="14" height="30">
      <animate attributeName="height" values="30;50;15;40;30" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="15;5;22.5;10;15" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="115" y="18" width="14" height="24">
      <animate attributeName="height" values="24;45;18;38;24" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="18;7.5;21;11;18" dur="1.3s" repeatCount="indefinite" />
    </rect>
  </g>
  <text x="145" y="35" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1DB954">Now Playing</text>
</svg>
